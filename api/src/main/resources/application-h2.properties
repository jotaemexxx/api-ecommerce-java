# Perfil H2 em memoria - somente para execucao e testes locais rapidos.
# NAO usar em producao. Nao ha persistencia: o schema e os dados sao
# recriados a cada inicializacao da aplicacao.

# --- Datasource: banco H2 totalmente em memoria ---
# MODE=PostgreSQL aproxima o dialeto SQL do Postgres usado em prod (supabase/docker).
# DB_CLOSE_DELAY=-1 mantem o banco vivo enquanto a JVM existir (evita que ele
# seja descartado quando a ultima conexao do pool fecha).
spring.datasource.url=jdbc:h2:mem:ecommerce;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# create-drop: o Hibernate cria o schema a partir das entidades no boot e o
# remove no shutdown. Adequado para um banco efemero em memoria.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- Console web do H2 em http://localhost:8080/h2-console ---
# JDBC URL a informar no console: jdbc:h2:mem:ecommerce
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Segredo JWT apenas para desenvolvimento local ---
# Sobrescreve o ${JWT_SECRET} do application.properties, permitindo rodar este
# perfil sem nenhuma variavel de ambiente. Valor fixo e publico: sem valor em
# producao, onde o segredo continua vindo da variavel de ambiente.
jwt.secret=h2-local-dev-secret-nao-use-em-producao-0123456789-abcdef
