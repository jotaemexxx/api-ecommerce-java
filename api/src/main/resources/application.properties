spring.application.name=api

# Porta: o Render (e outros PaaS) injetam a porta via env PORT. Default 8080 para rodar local.
server.port=${PORT:8080}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.expiration=86400000
jwt.secret=${JWT_SECRET}

# Origens liberadas no CORS (lista separada por virgula). Default: dev do Angular.
# Em hmg/prod, sobrescreva com a env APP_CORS_ALLOWED_ORIGINS incluindo a URL do front.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}